name: pages

# Publishes ONLY the paper/ folder as the public research page.
# The repo's docs/ folder (guides, PDF, examples) is deliberately never served.
# Requires one manual setting: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload the paper folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: paper

      - id: deployment
        uses: actions/deploy-pages@v4
